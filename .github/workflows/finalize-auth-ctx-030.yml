name: Finalizar AUTH-CTX-030

on:
  push:
    branches:
      - main
    paths:
      - scripts/docs/finalize-auth-ctx-030.mjs
      - .github/workflows/finalize-auth-ctx-030.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-auth-ctx-030
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Corregir interpolación del generador
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/docs/finalize-auth-ctx-030.mjs')
          text = path.read_text(encoding='utf-8')
          old = "(_, index) => \\`${prefix}-\\${String(from + index).padStart(3, '0')}\\`"
          new = "(_, index) => \\`\\${prefix}-\\${String(from + index).padStart(3, '0')}\\`"
          if old not in text:
              raise SystemExit('No se encontró la interpolación defectuosa esperada.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validar sintaxis del cierre
        run: node --check scripts/docs/finalize-auth-ctx-030.mjs

      - name: Validar materialización
        run: node scripts/docs/finalize-auth-ctx-030.mjs

      - name: Aplicar materialización y transición
        run: node scripts/docs/finalize-auth-ctx-030.mjs --apply

      - name: Generar plan canónico
        run: node scripts/docs/build-plan-canonico.mjs

      - name: Validar plan canónico
        run: node scripts/docs/build-plan-canonico.mjs --check

      - name: Verificar estado esperado
        shell: bash
        run: |
          grep -F 'AUTH-CTX-030 — Definir plan de pruebas contractuales del contexto y la decisión' docs/plan-canonico/modular/00_CABECERA_Y_ESTADO.md
          grep -F 'OPS-AUD-001 — Inventariar todas las empresas, sedes, áreas, canales y puntos operativos' docs/plan-canonico/modular/00_CABECERA_Y_ESTADO.md
          grep -F 'OPS-AUD-002 — Identificar familias de actores y responsables reales por proceso' docs/plan-canonico/modular/00_CABECERA_Y_ESTADO.md
          grep -F '### [ ] AUTH-DB-035 — Implementar token transaccional de frescura e invalidación del contexto' docs/plan-canonico/modular/bloques/R_SUPABASE/02_R1_FUNDACION_FISICA_CANONICA.md
          grep -F '### [ ] SHELL-CTX-006 — Implementar caché compartida, single-flight y validación de frescura' docs/plan-canonico/modular/bloques/H_FUNDACION_COMPARTIDA/03_AUTORIZACION_Y_CONTEXTO_COMPARTIDOS.md

      - name: Commit y push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No hay cambios pendientes.'
            exit 0
          fi
          git commit -m 'docs: cerrar AUTH-CTX-030 y activar BLOQUE E1'
          git push origin HEAD:main
