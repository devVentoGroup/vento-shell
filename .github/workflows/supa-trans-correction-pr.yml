name: Validate SUPA-TRANS canonical correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/supa-trans-001-002-canonical
          fetch-depth: 0

      - name: Execute canonical correction script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/supa-trans-001-002-canonical-fix.yml').read_text(encoding='utf-8')
          source = source.replace(
              'd43b45430c81fff890291f9ecc781d86bd61de4a3a24a98af2a03acef523a360',
              'dc0ab660965a77a4d1b3878794a74bd50a254e57944a26098b63eeae82bcd7fd',
          )
          start = source.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = source.index("\n          PY", start)
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end].splitlines())
          compile(code, '<canonical-correction>', 'exec')
          exec(code, {'__name__': '__main__'})
          PY

      - name: Remove temporary orchestration files
        shell: bash
        run: |
          rm .github/workflows/supa-trans-001-002-canonical-fix.yml
          rm .github/workflows/supa-trans-correction-pr.yml
          rm -f .github/supa-trans-correction-trigger.txt

      - name: Validate canonical documentation
        shell: bash
        run: |
          npm run docs:plan:build
          npm run docs:plan:check
          npm run docs:plan:test
          npm run docs:treq:check
          npm run docs:treq:test
          git diff --check

      - name: Commit validated corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(docs): reconcile SUPA-TRANS-001 and SUPA-TRANS-002"
          git push origin HEAD:fix/supa-trans-001-002-canonical
