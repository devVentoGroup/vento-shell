name: Validar plan canónico

on:
  pull_request:
    paths:
      - "docs/plan-canonico/modular/**"
      - "scripts/docs/**"
      - "package.json"
      - ".github/workflows/validate-canonical-plan.yml"
  push:
    branches:
      - main
    paths:
      - "docs/plan-canonico/modular/**"
      - "scripts/docs/**"
      - "package.json"
      - ".github/workflows/validate-canonical-plan.yml"

permissions:
  contents: write

jobs:
  validate:
    name: Compilar y verificar fuentes canónicas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Normalizar TREQ históricos de Supabase
        run: node scripts/docs/fix-supa-treq-history.mjs

      - name: Publicar normalización histórica
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/plan-canonico/modular/bloques/E1_DESCUBRIMIENTO_OPERATIVO/04A_REGISTRO_CANONICO_DE_REQUISITOS_DE_PRUEBA.md
            git commit -m "docs: normalizar TREQ históricos de Supabase"
            git push
          fi

      - name: Compilar plan canónico
        run: npm run docs:plan:build

      - name: Probar continuidad documental
        run: npm run docs:plan:test

      - name: Probar validador del registro TREQ
        run: npm run docs:treq:test

      - name: Verificar registro TREQ
        run: npm run docs:treq:check

      - name: Verificar invariantes y compilado
        run: npm run docs:plan:check
