name: Normalize CODE-AUD-011 and QA registry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: startsWith(github.head_ref, 'trigger-code-aud-011-normalization')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize CODE-AUD-011
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/plan-canonico/modular/bloques/E1_DESCUBRIMIENTO_OPERATIVO/04_AUDITORIA_DE_IMPLEMENTACION_ACTUAL.md')
          audit = path.read_text(encoding='utf-8')

          marker = '### ✅ CODE-AUD-011 — Detectar infraestructura sin proceso funcional utilizable'
          next_marker = '### [ ] CODE-AUD-012 — Detectar procesos implementados solo parcialmente'
          marker_pos = audit.find(marker)
          if marker_pos < 0:
              raise SystemExit('CODE-AUD-011 marker not found')
          start = audit.rfind('**PROPUESTA PARA APROBACIÓN**', 0, marker_pos)
          if start < 0 or marker_pos - start >= 200:
              start = marker_pos
          end = audit.find(next_marker, marker_pos)
          if end < 0:
              raise SystemExit('CODE-AUD-012 marker not found')

          block = audit[start:end]
          block = block.replace('**PROPUESTA PARA APROBACIÓN**\n\n', '', 1)
          block = block.replace('#### 12. Requisitos de prueba derivados', '___REQ_START___', 1)
          req_start = block.find('___REQ_START___')
          decisions = block.find('#### 14. Decisiones propuestas', req_start)
          if req_start < 0 or decisions < 0:
              raise SystemExit('Expected duplicated requirements sections not found')

          clean_requirements = '\n'.join([
              '#### 12. Requisitos de prueba derivados',
              '',
              '**Resultado:** GENERA REQUISITOS DE PRUEBA',
              '',
              'Requisitos nuevos derivados:',
              '',
              '- `TREQ-SHELL-001`;',
              '- `TREQ-NEXO-004`;',
              '- `TREQ-PULSO-001`.',
              '',
              'Requisitos reutilizados:',
              '',
              '- `TREQ-NEXO-003`;',
              '- `TREQ-AUTH-001`;',
              '- `TREQ-AUTH-002`.',
              '',
              'Las definiciones completas, estados, responsables, ambientes y evidencias de estos requisitos existen únicamente en:',
              '',
              '```text',
              'docs/plan-canonico/modular/bloques/E1_DESCUBRIMIENTO_OPERATIVO/04A_REGISTRO_CANONICO_DE_REQUISITOS_DE_PRUEBA.md',
              '```',
              '',
              'No se duplican filas completas del Registro Canónico dentro de esta tarea.',
              '',
              '---',
              '',
          ])
          block = block[:req_start] + clean_requirements + block[decisions:]
          block = block.replace('#### 14. Decisiones propuestas', '#### 13. Decisiones aprobadas', 1)
          block = block.replace('#### 15. Límites de certeza', '#### 14. Límites de certeza', 1)
          block = block.replace('#### 16. Criterios de aceptación', '#### 15. Criterios de aceptación', 1)
          block = block.replace('#### 17. Resultado y continuidad', '#### 16. Resultado y continuidad', 1)
          block = block.replace('19. Se crea `TREQ-SHELL-001`.', '19. Se deriva `TREQ-SHELL-001`.', 1)
          block = block.replace('20. Se crea `TREQ-NEXO-004`.', '20. Se deriva `TREQ-NEXO-004`.', 1)
          block = block.replace('21. Se crea `TREQ-PULSO-001`.', '21. Se deriva `TREQ-PULSO-001`.', 1)
          block = block.replace('23. Se corrige el registro 04A antes de avanzar.\n', '', 1)
          block = block.replace('24. No se crea una tarea nueva del roadmap.', '23. No se crea una tarea nueva del roadmap.', 1)
          block = block.replace('25. `CODE-AUD-012` será la única continuidad inmediata.', '24. `CODE-AUD-012` será la única continuidad inmediata.', 1)
          for obsolete in (
              '- se creen las tres filas nuevas `TREQ-*`;\n',
              '- se corrija la fila concatenada en 04A;\n',
              '- se materialicen los cuatro requisitos aprobados de `CODE-AUD-010`;\n',
          ):
              block = block.replace(obsolete, '', 1)

          normalized = audit[:start].rstrip() + '\n' + block.strip() + '\n\n' + audit[end:]
          path.write_text(normalized, encoding='utf-8')

          final_start = normalized.find(marker)
          final_end = normalized.find(next_marker, final_start)
          final_block = normalized[final_start:final_end]
          if normalized.count(marker) != 1:
              raise SystemExit('CODE-AUD-011 duplicated')
          if '##### 12.3.' in final_block or 'Corrección documental obligatoria de 04A' in final_block:
              raise SystemExit('Duplicated registry material remains')
          if '**PROPUESTA PARA APROBACIÓN**' in final_block:
              raise SystemExit('Proposal marker remains')
          print('CODE-AUD-011 normalized successfully')
          PY

      - name: Remove temporary migration files
        shell: bash
        run: |
          rm -rf .github/tmp-code-aud-011
          rm -f .github/workflows/tmp-normalize-code-aud-011.yml

      - name: Commit canonical normalization
        shell: bash
        run: |
          git config user.name 'devVentoGroup'
          git config user.email 'dev.ventogroup@gmail.com'
          git add -A
          git commit -m 'docs(e1): normalize CODE-AUD-011 and QA registry'
          git push origin main
