name: Normalize CODE-AUD-011 and QA registry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'trigger-code-aud-011-normalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize canonical documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          audit_path = Path('docs/plan-canonico/modular/bloques/E1_DESCUBRIMIENTO_OPERATIVO/04_AUDITORIA_DE_IMPLEMENTACION_ACTUAL.md')
          registry_path = Path('docs/plan-canonico/modular/bloques/E1_DESCUBRIMIENTO_OPERATIVO/04A_REGISTRO_CANONICO_DE_REQUISITOS_DE_PRUEBA.md')
          temp_dir = Path('.github/tmp-code-aud-011')

          def decode_file(path: Path) -> str:
              raw = base64.b64decode(path.read_text(encoding='utf-8').strip())
              return gzip.decompress(raw).decode('utf-8')

          clean_task = decode_file(temp_dir / 'task.md.gz.b64').rstrip() + '\n'
          clean_registry = decode_file(temp_dir / 'registry.md.gz.b64').rstrip() + '\n'

          audit = audit_path.read_text(encoding='utf-8')
          marker = '### ✅ CODE-AUD-011 — Detectar infraestructura sin proceso funcional utilizable'
          next_marker = '### [ ] CODE-AUD-012 — Detectar procesos implementados solo parcialmente'
          start = audit.find(marker)
          if start < 0:
              raise SystemExit('CODE-AUD-011 marker not found')
          proposal = audit.rfind('**PROPUESTA PARA APROBACIÓN**', 0, start)
          if proposal >= 0 and start - proposal < 200:
              start = proposal
          end = audit.find(next_marker, start)
          if end < 0:
              raise SystemExit('CODE-AUD-012 marker not found')

          normalized = audit[:start].rstrip() + '\n' + clean_task + '\n' + audit[end:]
          audit_path.write_text(normalized, encoding='utf-8')
          registry_path.write_text(clean_registry, encoding='utf-8')

          task_start = normalized.find(marker)
          task_end = normalized.find(next_marker, task_start)
          task_block = normalized[task_start:task_end]
          print('CODE-AUD-011 markers:', normalized.count(marker))
          print('Task block length:', len(task_block))
          print('Has duplicated full rows:', '##### 12.3.' in task_block)
          print('Has correction section:', 'Corrección documental obligatoria de 04A' in task_block)
          print('Registry rows:', len([line for line in clean_registry.splitlines() if line.startswith('| `TREQ-')]))
          PY

      - name: Remove temporary migration files
        shell: bash
        run: |
          rm -rf .github/tmp-code-aud-011
          rm -f .github/workflows/tmp-normalize-code-aud-011.yml

      - name: Commit canonical normalization
        shell: bash
        run: |
          git config user.name 'devVentoGroup'
          git config user.email 'dev.ventogroup@gmail.com'
          git add -A
          git commit -m 'docs(e1): normalize CODE-AUD-011 and QA registry'
          git push origin main
          git push origin --delete trigger-code-aud-011-normalization || true
