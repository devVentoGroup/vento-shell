name: Rebuild canonical plan after CODE-AUD-011

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.head_ref == 'trigger-rebuild-code-aud-011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and validate canonical plan
        run: |
          node scripts/docs/build-plan-canonico.mjs
          node scripts/docs/build-plan-canonico.mjs --check

      - name: Remove temporary workflow
        run: rm -f .github/workflows/tmp-rebuild-plan.yml

      - name: Commit regenerated artifacts
        run: |
          git config user.name 'devVentoGroup'
          git config user.email 'dev.ventogroup@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
          else
            git commit -m 'docs: rebuild canonical plan after CODE-AUD-011'
            git push origin main
          fi
